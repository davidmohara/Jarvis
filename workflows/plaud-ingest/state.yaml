  for a future skill fix). Recovered by re-applying rename_speaker() directly against
  the reverted trans_result (Speaker 2 -> Robyn Fuentes, 91 segments, PATCH succeeded,
  DB layer clean again: O'Hara=72, Robyn Fuentes=104, 176 total) and then building the
  staged transcript markdown myself directly from the clean trans_result segments
