  rename verification: check_speaker_names_in_transcript() only checks whether the
  new name appears ANYWHERE in the transcript, not whether the old generic label is
  gone -- so it falsely reported "verified" while 92 of 104 "Speaker 2" segments
  were still unconverted in the transaction_polish (web UI) layer, even though the
  trans_result (DB) layer was already clean. Manually forcing a second
