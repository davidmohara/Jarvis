  weekly_themes:
  - theme_id: 1
    theme_title: Microsoft Just Picked a Side in the Agent Identity War
    synthesis: "Microsoft shipped Copilot Studio agent accounts (Oct 15, 2026): agents
      now get their own Entra ID rather than borrowing user credentials. Google shipped
      agent Workspace identity on Oct 8. Both major enterprise stacks deployed competing
      agent identity architectures in the same month. New argument vs W42's 'agents
      getting identities' framing: W43 is about vendor choice — Microsoft and Google
      have committed to architecturally different models, and clients running M365 or
      Google Workspace must now evaluate whether their governance policies extend to
      agent accounts (which are distinct from service principals in licensing and behavior)."
    source_items:
    - 'Microsoft Copilot Studio agent accounts preview — Windows Forum (2026-10-15)'
    - 'Google Gemini agent Workspace identity — TechCrunch (2026-10-08)'
    content_angles:
    - Microsoft Just Picked a Side in the Agent Identity War
  - theme_id: 2
    theme_title: The Agent Inventory You Don't Know You Have
    synthesis: "OutSystems surveyed 850+ IT DMs (Oct 15, 2026): 96% using agents,
      94% report sprawl increasing complexity/security risk, only 26% prepared for
      agent conflicts between systems. New argument vs prior shadow AI coverage: these
      are authorized deployments IT sanctioned and then lost operational track of.
      The governance failure is architectural — no accounting system was built before
      the agents were. An agent registry is a prerequisite, not a follow-on."
    source_items:
    - 'OutSystems Agentic AI Enterprise Readiness research (2026-10-15) — SD Times coverage'
    content_angles:
    - The Agent Inventory You Don't Know You Have
  - theme_id: 3
    theme_title: Your Manager Is Worth More Than Your AI Budget
    synthesis: "Microsoft Work Trend Index 2026 (20,000 workers, 10 countries): organizational
      factors — culture, manager support, talent practices — account for 67% of reported
      AI productivity impact vs 32% for individual mindset (2:1 ratio). isolved HR
      Leaders Report (Oct 14, 2026, 1,005 DMs): strategic AI expectations outpacing
      capacity of people leaders. New argument vs W42 readiness benchmarks: the lever
      is manager-level AI capability, not individual tools training. Investment implication
      shifts."
    source_items:
    - 'Microsoft Work Trend Index 2026 — worklab.microsoft.com'
    - 'isolved HR Leaders Report October 2026'
    content_angles:
    - Your Manager Is Worth More Than Your AI Budget
