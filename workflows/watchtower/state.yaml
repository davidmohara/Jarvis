accumulated-context:
  through_line: "Today's signals all point the same direction: capability is outrunning ownership. CIOs take the blame for AI failures nobody clearly assigned, agentic AI adoption is mostly announcement not production, and the leadership research says the fix is org redesign, not another tool."
  consulting_read: "The client conversation this week isn't 'should we adopt agentic AI', it's 'who owns the decision when it goes wrong, and did we actually redesign the org around it or just buy the license.' Deloitte packaging a hybrid-model practice and Kyndryl/Broadcom repositioning on VMware both say the same thing from the vendor side: delivery model is the new battleground, not raw capability. Improving's angle is the judgment and governance layer, closing the gap between 'we deployed agents' and 'someone owns what they do', which is exactly where CIOs are getting blamed for decisions they didn't fully control."
  summarized_items:
    - title: "CIOs bear the brunt of blame over AI mistakes"
      url: "https://www.ciodive.com/news/CIOs-take-blame-AI-mistakes/829841/"
      source_name: "CIO Dive"
      published_date: "2026-09-08"
      topic: "it-consulting"
      score: 88
      content_worthy: true
      summary: "CIOs are absorbing the blame when enterprise AI initiatives misfire, even when the root cause sits in unclear governance or business-side decisions made above their pay grade. This is the accountability gap David's clients are living in right now: someone owns the AI outcome on paper, but the decision rights are diffuse. Worth raising directly in engagement conversations — who actually owns the AI decision at this client, and does the org chart match reality?"
    - title: "The State Of Agentic AI In 2026: Companies Are Chasing, Few Are Catching"
      url: "https://www.forrester.com/blogs/the-state-of-agentic-ai-in-2026-companies-are-chasing-few-are-catching/"
      source_name: "Forrester"
      published_date: "2026-09-01"
      topic: "ai-agentic"
      score: 84
      content_worthy: true
      summary: "Forrester's read is blunt: most enterprises are pursuing agentic AI, but almost none have scaled multi-agent systems running in production beyond glorified chatbots. The gap between the agentic AI announcement and the agentic AI actually doing work is the live sales argument right now. It reinforces that the judgment layer, what to build, in what sequence, how to govern it, is the part clients still can't do alone."
    - title: "Deloitte aims to help enterprises with hybrid AI model strategy"
      url: "https://www.ciodive.com/news/Deloitte-open-source-models-practice-engineering/829722/"
      source_name: "CIO Dive"
      published_date: "2026-09-04"
      topic: "it-consulting"
      score: 80
      content_worthy: true
      summary: "Deloitte is standing up a practice around hybrid proprietary-plus-open-source model strategy, another signal of how the Big Four are packaging AI delivery into productized offerings. It matters because it shows where the largest competitors are placing their bets on delivery model, not just capability. Worth watching whether this shifts client expectations toward a menu of model-strategy options rather than a single vendor recommendation."
    - title: "AI Adoption in 2026: How Leaders Must Redesign Their Org Now"
      url: "https://barryoreilly.com/explore/blog/ai-adoption-2026-leadership-organizational-redesign/"
      source_name: "Barry O'Reilly"
      published_date: "2026-08-20"
      topic: "leadership"
      score: 78
      content_worthy: true
      summary: "AI transformation fails when leadership treats it as a tooling rollout instead of a capability and operating-model change, and succeeds when leaders redesign roles, decision rights, and workflows around it. This lands squarely on the leadership/EOS lens: the org design work is the actual transformation, the software is just the trigger. A clean angle for a leadership piece on what separates firms that run well with AI from firms that just bought licenses."
    - title: "CNBC bringing second annual AI Forum to Dallas"
      url: "https://dallasinnovates.com/calendar/"
      source_name: "Dallas Innovates"
      published_date: "2026-09-05"
      topic: "texas-regional"
      score: 71
      content_worthy: false
      summary: "CNBC is returning to Dallas with its second annual AI Forum, convening executives and researchers on how AI is reshaping work and workforces. It's a visible marker of DFW's continued positioning as a national AI business hub, and a concrete networking or attendance opportunity. Worth a look at the speaker list and agenda once published."
    - title: "Agentic AI Enterprise Adoption 2026: 72% Production Proven, governance gap widens"
      url: "https://agenticaiinstitute.org/agentic-ai-enterprise-adoption-2026-governance-gap/"
      source_name: "Agentic AI Institute"
      published_date: "2026-09-01"
      topic: "ai-agentic"
      score: 70
      content_worthy: false
      summary: "New data puts 72% of firms with agents in production, but 60% still lack formal governance around those deployments. It's the same shape of gap as the Forrester finding above, technical capability outrunning organizational readiness, just quantified from a different angle. Useful as a supporting stat rather than a standalone argument."
    - title: "Samsung moving U.S. headquarters to Plano; Lite-On picks McKinney for ~$1B campus"
      url: "https://dallasinnovates.com/business/"
      source_name: "Dallas Innovates"
      published_date: "2026-09-05"
      topic: "texas-regional"
      score: 70
      content_worthy: false
      summary: "Samsung is relocating its U.S. headquarters to Plano while Lite-On commits to a nearly $1 billion campus in McKinney, both landing in the northern DFW suburbs. This continues the region's run of major corporate HQ and manufacturing investment, which keeps feeding the broader talent and vendor ecosystem David operates in. Worth tracking which of these companies become client-relevant over the next two quarters."
    - title: "Kyndryl, Broadcom bet on VMware skills as private cloud demand returns"
      url: "https://www.ciodive.com/news/kyndryl-broadcom-bet-on-vmware-skills-private-cloud/829723/"
      source_name: "CIO Dive"
      published_date: "2026-09-04"
      topic: "it-consulting"
      score: 72
      content_worthy: false
      summary: "Kyndryl and Broadcom are repositioning around VMware skills as enterprise demand swings back toward private cloud after a period of public-cloud-first assumptions. It's a delivery-model signal worth noting for anyone running infrastructure-services practices, the market didn't fully abandon private cloud, it paused. Worth checking whether Improving's infra practice needs a similar skills recalibration."
    - title: "MIT/Wharton/BCG research: AI transformation fails as automation, succeeds as capability change"
      url: "https://eonetwork.org/blog/how-ai-is-reshaping-talent-teams-and-leadership-and-what-employers-must-do-next/"
      source_name: "EOS Worldwide Blog"
      published_date: "2026-08-15"
      topic: "leadership"
      score: 68
      content_worthy: false
      summary: "Cross-institution research from MIT, Wharton, and BCG backs up the same finding as the Barry O'Reilly piece: AI success correlates with leaders reframing rollouts as workflow and mindset redesign rather than tool deployment. It's academic validation of a theme David is already tracking, useful as supporting citation for a leadership argument rather than a fresh angle on its own."
