  weekly_themes:
  - theme_id: 1
    theme_title: Agents Are Your Newest Insiders
    synthesis: 'Microsoft extended Project Perception on Oct 19, 2026 to treat internal AI agents as insiders: Dynamic Permissions (start with none, grant per task, expire, human review for high-impact actions), Dynamic Agent Risk (continuously updated score), Dynamic Conditional Access (reduce, read-only, require approval, isolate or halt), plus Guardian Agents and discovery of 60 local agent types. New argument vs the prior week''s agent-account story: giving an agent an Entra identity answers who it is, not what it may do right now. Recommended action changes from extending governance to agent accounts to designing task-scoped, expiring, risk-aware access. Vendor announcement; no pricing or availability date in the coverage found.'
    source_items:
    - Microsoft Targets Rogue AI Agents With Dynamic Permissions, Risk Scoring - SecurityWeek (2026-10-20) https://www.securityweek.com/microsoft-targets-rogue-ai-agents-with-dynamic-permissions-risk-scoring/
    - Securing the Agentic Insider - Microsoft (2026-10-19) https://blogs.microsoft.com/blog/2026/10/19/securing-the-agentic-insider/
    content_angles:
    - Agents Are Insiders Now, So Stop Giving Them Standing Access
  - theme_id: 2
    theme_title: Give Every Agent a Manager
    synthesis: 'ServiceNow''s AI Passport announcement (Q4 2026 availability) quotes LTM''s CISO: 1,500 AI agents, each with an employee ID and a manager, tracked in one system of record. SK Telecom''s first AI Governance Report reportedly records a supervisor per agent (secondary source only). New argument vs the prior week''s agent-inventory theme: a registry says what exists, not who answers for it. Action: assign a named human owner at provisioning and make that owner the approver for high-impact actions. Vendor press release, not independently verified.'
    source_items:
    - ServiceNow advances its operational harness for enterprise AI with AI Passport and expanded governance capabilities - ServiceNow Newsroom (Oct 2026) https://newsroom.servicenow.com/press-releases/details/2026/ServiceNow-advances-its-operational-harness-for-enterprise-AI-with-AI-Passport-and-expanded-governance-capabilities/default.aspx
    - Microsoft Targets Rogue AI Agents With Dynamic Permissions, Risk Scoring - SecurityWeek (2026-10-20) https://www.securityweek.com/microsoft-targets-rogue-ai-agents-with-dynamic-permissions-risk-scoring/
    content_angles:
    - Give Every Agent a Manager
  - theme_id: 3
    theme_title: The Airport Hired an AI Lead
    synthesis: 'DFW Airport created a principal AI lead role (posting reported Oct 13, 2026; posting no longer live) combining governance (guidelines against unauthorized AI use), capability (infrastructure, pilots, about $6.5M earmarked for AI tools this budget year) and people (HR training for 2,000+ employees, cultural shift). Love Field spreads AI duties across teams; Denver has at least four people on AI strategy. New argument: a non-tech organization gave AI governance, capability and culture one named owner instead of a committee. Fits steering toward human-side and regional stories beyond infrastructure.'
    source_items:
    - DFW Airport Creates New Role to Lead AI Push - Dallas Innovates (2026-10-13) https://dallasinnovates.com/dfw-airport-creates-new-role-to-lead-ai-push/
    content_angles:
    - The Airport Hired an AI Lead. What Did You Hire?
