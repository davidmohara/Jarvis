    theme_title: Adoption Is Real. Scale Is Theater.
    synthesis: 'Forrester''s read: most enterprises are pursuing agentic AI, but almost
      none have scaled multi-agent systems beyond glorified chatbots. The 72% ''agents
      in production'' stat from Agentic AI Institute lands differently next to Forrester''s
      ''few are catching'' headline — what''s in production isn''t what people think
      when they say ''in production.'' This is new from W37''s build-decision theme
      (which covered the procurement shift) and from the prior governance themes:
      the specific argument here is that the adoption scorecard is being falsified
      by how ''production'' is defined, and David''s consulting angle is the gap between
      headline and reality.'
    source_items:
    - 'The State Of Agentic AI In 2026: Companies Are Chasing, Few Are Catching —
      Forrester (2026-09-01)'
    - 'Agentic AI Enterprise Adoption 2026: 72% Production Proven, governance gap
      widens — Agentic AI Institute (2026-09-01)'
    content_angles:
    - Adoption Is Real. Scale Is Theater.
