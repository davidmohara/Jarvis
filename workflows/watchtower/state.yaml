  weekly_themes:
    - theme_id: 1
      theme_title: "EU AI Act Goes Live — Deployers Are the Exposed Class"
      synthesis: "The EU AI Act's Article 50 transparency obligations became enforceable on August 2, 2026. The critical new argument: vendor compliance documentation does not cover deployer obligations. Every organization that embedded an AI API into a product serving EU users bears distinct legal liability, regardless of their vendor's certifications. US companies with EU customers, employees, or operations are in scope. New vs. W31: W31's FinOps angle was about unpredictable cost exposure. This is legal liability exposure — a different risk category with a different recommended action: audit every AI deployment for EU-facing scope and document Article 50 disclosure implementations now, or face fines up to €35M or 7% of global revenue."
      source_items:
        - "EU AI Act Chatbot Disclosure Reaches API Builders Sunday: Vendors Cannot Comply for You (TechTimes, July 31 2026)"
        - "EU AI Act Enforcement: What Aug 2, 2026 Means (Olakai)"
        - "The EU Just Put AI Disclosure Into Law. Here Is What a US Business Owner Actually Has to Do (LaunchReady.ai)"
      content_angles:
        - "Your Vendor Checked the Box. You Still Haven't."
    - theme_id: 2
      theme_title: "The Agent Accountability Void"
      synthesis: "The State of AI Agent Security 2026 (Gravitee, 900+ respondents) documents that 88% of organizations experienced an AI agent-related security breach in the past 12 months, and only 7.2% have a named individual with formal accountability for agent behavior. Enterprise AI agents nearly doubled in Q1 2026 alone. New vs. W31: W31's token pricing theme was about cost governance (FinOps, who owns the bill). This is a security and accountability void: agents are deployed with no identity, no accountability structure, and no one to call when one causes a breach. Different actor, different recommended action: build per-agent identity management and assign formal accountability roles before your incident count joins the 88%."
      source_items:
        - "State of AI Agent Security 2026 Report: When Adoption Outpaces Control (Gravitee)"
        - "AI Agent Security in 2026: Enterprise Risks & Best Practices (Beam.ai)"
        - "2026 Data Breach Investigations Report — Identity Is the Control Plane for Agentic AI (Token Security)"
      content_angles:
        - "Nobody Owns the Agent"
    - theme_id: 3
      theme_title: "The Knowledge Premium Is the Thing That's Dying"
      synthesis: "McKinsey is cutting 3,000-4,000 positions (10% of workforce), concentrated in junior research and knowledge-intensive functions. Bain, BCG, Capgemini, and Deloitte are making parallel cuts. The new argument: an IE Business School professor framed it precisely: 'AI is replacing the technical expertise and insight that for decades justified the existence of these firms as privileged intermediaries of knowledge.' New vs. W31/W29: W31 was about reskilling failure as a firing criterion (Accenture). W29 was about pyramid pricing collapsing (structure). W32 is about what the premium was actually for: selling access to knowledge that AI now provides freely. If you charge for knowing things, you're in trouble. If you charge for judgment, relationships, and delivery accountability, you still have a business."
      source_items:
        - "Why the McKinsey layoffs are a warning signal for consulting in the AI age (Fast Company)"
        - "McKinsey Layoffs 2026: 10% Job Cuts Affecting Thousands Because of AI (Final Round AI)"
      content_angles:
        - "The Premium You Charged Was for Knowing Things"
    - theme_id: 4
      theme_title: "North Texas Shifts from AI Consumer to AI Maker"
      synthesis: "Wistron opened its $700M, 324,000 sq ft Fort Worth facility on July 21, producing Nvidia GB300 Grace Blackwell Ultra Superchips. LITEON announced a $919M McKinney facility for AI power systems, backed by a state grant. North Texas just became a site for AI hardware manufacturing, not just consumption. New vs. prior Texas themes: W28 covered data center expansion and grid stress; W30 covered Abbott's regulatory moves on energy policy. This is different: Texas is producing the chips and power infrastructure at scale, creating a new supply chain ecosystem and a new talent story — from software engineers to semiconductor manufacturing. The implication for David's clients: Texas enterprises have a proximity-to-supply advantage that is not replicable in most other states."
      source_items:
        - "Wistron Opens $700 Million Fort Worth Plant for Nvidia AI Systems (CNBC, July 22 2026)"
        - "Built in Fort Worth: Wistron Opens Advanced Manufacturing Plant to Produce NVIDIA AI Systems (NVIDIA Blog)"
        - "Governor Abbott Announces LITEON AI Facility, McKinney TX (FOX4 DFW)"
      content_angles:
        - "Texas Is Building the Chips Now, Not Just Running Them"
