    - theme_id: 3
      theme_title: "Agent Sprawl Is the Operational Layer Under the Identity Problem"
      synthesis: "OutSystems (1,900 IT leaders): 96% of enterprises run AI agents, 12% govern them centrally, 94% flag sprawl as growing security risk, 38% mix custom-built and pre-built agents in ungovernable stacks. W33 covered agent identity as a security perimeter problem (access policies, NHI lifecycle, visibility gaps). W34's sprawl story is the operational layer that precedes identity governance: before you can govern what agents access, you have to know how many exist, who built them, and who owns them. What's new: the identity governance conversation assumes agents are at least inventoried. In most enterprises, they aren't. The sprawl precedes the identity problem."
      source_items:
        - "Agentic AI Goes Mainstream in the Enterprise, but 94% Raise Concern About Sprawl (OutSystems, 2026)"
        - "The AI Agent Governance Paradox: 96% of Enterprises Use Them, 12% Can Govern Them (Remio.ai)"
        - "Agentic AI Governance Is the CIO's Most Urgent Blind Spot (TechHQ)"
      content_angles:
        - "You Can't Govern an Inventory You Don't Know You Have"
