    synthesis: 'Microsoft extended Project Perception on Oct 19, 2026 to treat internal AI agents as insiders: Dynamic Permissions (start with none, grant per task, expire, human review for high-impact actions), Dynamic Agent Risk (continuously updated score), Dynamic Conditional Access (reduce, read-only, require approval, isolate or halt), plus Guardian Agents and discovery of 60 local agent types. New argument vs the prior week''s agent-account story: giving an agent an Entra identity answers who it is, not what it may do right now. Recommended action changes from extending governance to agent accounts to designing task-scoped, expiring, risk-aware access. Vendor announcement; no pricing or availability date in the coverage found.'
