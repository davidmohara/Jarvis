      theme_title: "The Build Decision Changed the Relationship"
      synthesis: "McKinsey's State of AI 2026 found 32% of organizations skipped at least one software purchase because they built internally with agentic coding tools — nearly 50% among AI high performers. Despite this building activity, EBIT impact held flat at 37% and 1 in 5 orgs now limits AI use due to operating costs. New argument vs. W36: not project cancellation risk but the restructuring of the client's fundamental procurement relationship with consulting. The judgment layer (what to build, in what order, how to measure) is the remaining moat."
      source_items:
        - "The State of AI: Global Survey 2026 — McKinsey"
        - "The Build-vs-Buy Shift: 32% of Enterprises Bet on Agentic Coding Tools"
        - "Retool 2026 Build vs. Buy Report"
      content_angles:
        - "The Build Decision Changed the Relationship"
    - theme_id: 2
      theme_title: "Your Manager Is the AI Strategy"
      synthesis: "Gallup's State of the Global Workplace 2026: employees with AI-supportive managers are 8.7x more likely to say AI transformed their work. Manager engagement is declining 3x faster than employee engagement. McKinsey's State of Organizations 2026: 86% of executives say their org isn't ready to embed AI; only 25% of workers use AI regularly despite 86% of CEOs claiming employees already have the skills. New argument vs. W35 (adoption failure broadly): the management layer is the specific 8.7x multiplier, not culture or strategy generally."
      source_items:
        - "Gallup State of the Global Workplace 2026: AI's Effect on Workplace Culture"
        - "The State of Organizations 2026 — McKinsey"
      content_angles:
        - "Your Manager Is the AI Strategy"
    - theme_id: 3
      theme_title: "The Incident Rate Is In"
      synthesis: "Strata's 2026 AI identity research: 88% of enterprises had a confirmed or suspected AI agent security incident in the last year. 92% lack visibility into their AI identities. Root cause: sharing human credentials with agents. New argument vs. W33 (governance gap) and W34b (market valuation): the risk is no longer forward-looking. The incidents have happened at scale. The client conversation shifts from risk preparation to incident attribution and architecture remediation."
      source_items:
        - "The AI Agent Identity Crisis: A 2026 Guide — Strata"
        - "State of Agentic AI Security and Governance 2.01 — OWASP"
        - "9 Enterprise Identity Trends That Will Define 2026 — Security Boulevard"
      content_angles:
        - "The Incident Rate Is In"
  weekly_tweets:
    - text: "32% of enterprises skipped their last software purchase because they built it internally with AI coding tools. Among AI high performers, it's nearly 50%. If a third of your clients can build the thing you sell, the relationship just changed."
      supporting_url: "https://www.mckinsey.com.br/capabilities/quantumblack/our-insights/the-state-of-ai"
      angle_type: "data"
    - text: "The capability to build didn't produce the judgment to build the right thing. EBIT impact from AI held flat at 37% despite all this building. The gap between 'we can build it' and 'we built something that mattered' is exactly where consulting belongs."
      supporting_url: null
      angle_type: "practitioner"
    - text: "Employees whose managers actively support AI use are 8.7x more likely to say AI transformed their work. Not 8.7% more likely. Eight point seven times. Your AI strategy is a manager development problem."
      supporting_url: "https://www.gallup.com/workplace/712976/ai-effect-workplace-culture.aspx"
      angle_type: "data"
    - text: "Manager engagement is declining at 3x the rate of employee engagement. Meanwhile, 86% of CEOs say employees already have the AI skills they need. One of those numbers is wrong, and I don't think it's the manager data."
      supporting_url: null
      angle_type: "provocative"
    - text: "88% of enterprises reported a confirmed or suspected AI agent security incident last year. The 'before something goes wrong' framing is over. Something went wrong."
      supporting_url: "https://www.strata.io/blog/agentic-identity/the-ai-agent-identity-crisis-new-research-reveals-a-governance-gap/"
      angle_type: "data"
    - text: "92% of enterprises lack full visibility into their AI identities. Teams are sharing human credentials with agents because there's no alternative. This isn't a policy gap. It's an architecture gap."
      supporting_url: null
      angle_type: "practitioner"
    - text: "The question used to be: are you prepared for an AI agent security incident? 88% of the data says that question has been answered. The current question: do you know which of your incidents last year involved an agent?"
      supporting_url: null
      angle_type: "provocative"
    - text: "50% of CHROs say they're not confident their managers can guide employees on AI use. That's the person responsible for people strategy admitting the execution layer doesn't know what to do."
      supporting_url: null
      angle_type: "practitioner"
    - text: "One in five organizations is now limiting AI use because of operating costs. They built things. The things are expensive to run. Nobody priced the run cost when they approved the build."
      supporting_url: null
      angle_type: "data"
    - text: "When your team ran that last security incident, was there a field in the ticket for 'agent-initiated action'? If not, you may have had one and not known it."
      supporting_url: null
      angle_type: "question"
