  - theme_id: 1
    theme_title: The Activity Trap
    synthesis: '61% of leaders are under more pressure to prove AI ROI than a year
      ago, yet only 23% report significant ROI from AI agents. Kyndryl and Gartner
      both diagnose the same problem: enterprises are measuring activity (usage, deployments,
      pilots) instead of outcomes (P&L impact, cost-per-outcome). The consulting angle
      has shifted from "here''s how to build AI" to "here''s how to tie what you built
      to a number someone owns." New from W37: W37 covered the governance gap and
      adoption theater; this week''s signal is specifically the ROI accountability
      squeeze and what value realization actually requires operationally.'
    source_items:
    - 'Why value realization is key to achieving ROI in 2026 — Kyndryl (2026-02)'
    - 'Accelerate Enterprise AI Value Realization — Gartner CIO Guide (2026)'
    - 'Enterprise AI in 2026: How Business and IT Co-Create Real ROI — Futransolutions
      (2026)'
    content_angles:
    - The Activity Trap
  - theme_id: 2
    theme_title: Intuition Rust
    synthesis: 'CHI 2026 research introduced "intuition rust": the gradual dulling
      of expert judgment when AI consistently handles the analysis layer, leaving the
      human to atrophy the cognitive muscle that built their expertise. AIIM''s 2026
      Industry Watch captured the same effect across information professions globally.
      This is the professional identity question David''s config pushes toward — what
      it means to be an expert, a consultant, a leader when AI compresses information
      asymmetry. Entirely new territory not covered in any prior Watchtower week.'
    source_items:
    - 'AI and identity work: fragmentation of professional identity — ScienceDirect
      (2026)'
    - 'From Future of Work to Future of Workers: Asymptomatic AI Harms — CHI 2026'
    - 'AIIM 2026 Industry Watch: Work, Skills, and Identity of the Information Professional'
    content_angles:
    - What Happens to an Expert When AI Knows Everything They Know
  - theme_id: 3
    theme_title: DFW Is Now the AI Talent Market
    synthesis: 'CBRE''s Scoring Tech Talent 2026 ranked DFW eighth in North America
      overall with 37,230 net new tech workers added (2022-2025), the second-largest
      gain of any tracked market. CompTIA put DFW fifth specifically for AI-role hiring.
      Pudu Robotics relocated its U.S. HQ from Silicon Valley to Richardson. This
      is a talent story, not an infrastructure story — distinct from the data center
      and policy coverage that dominated W28-W34b, and directly aligned with config
      push toward regional business stories beyond Texas infrastructure.'
