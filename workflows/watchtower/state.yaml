  weekly_themes:
  - theme_id: 1
    theme_title: The Rate Card Is the Argument
    synthesis: 'Cognizant announced on Sept 16 that outcome-based and fixed-price work
      now represents 58% of its mix, and published an "AI-infused rate card" framework
      ranging from A0 (fully human effort) to A3 (autonomous effort). This is not
      another headline about the consulting pyramid dying — it is the first time a
      major IT services firm has published a concrete pricing taxonomy for the human-to-AI
      effort spectrum. Firms that define this vocabulary for their clients own the
      pricing conversation for the next several years. New this week: W27-W34b covered
      the theoretical shift; this week gives it a named artifact and live execution
      data from a named firm.'
    source_items:
    - 'Cognizant Pivots to AI-Driven Outcomes, Digital Labor Model — MarketBeat/DefenseWorld
      (2026-09-16)'
    - 'AI in PS Delivery: What Works in 2026 — Rocketlane (2026)'
    content_angles:
    - The Rate Card Is the Argument
  - theme_id: 2
    theme_title: Culture Is the Constraint
    synthesis: "McKinsey's State of Organizations 2026 (10,000+ executives) found
      88% of organizations are deploying AI but 81% report no bottom-line impact.
      Organizational culture is nearly twice as predictive of AI value delivery as
      personal readiness. 86% of leaders say their org was not prepared; only 14%
      report leaders consistently championing adoption. New this week: W38 diagnosed
      what is being measured wrong; this week identifies the underlying reason why
      even organizations that know better still fail to change."
    source_items:
    - 'McKinsey The State of Organizations 2026 — McKinsey & Company (2026)'
    - 'AI Adoption in 2026: How Leaders Must Redesign Their Org Now — Barry O''Reilly
      (2026)'
    content_angles:
    - Culture Is the Constraint
  - theme_id: 3
    theme_title: The Apprenticeship Just Got Harder
    synthesis: "PwC's 2026 AI Jobs Barometer (1 billion+ job ads, 27 countries) found
      a two-track labor market forming: professionalised roles growing at 2x the rate
      with 42% faster salary growth, and AI-exposed junior U.S. roles now 7x more
      likely to require advanced human skills. New this week: W38's Intuition Rust
      covered expert judgment atrophy for existing professionals; PwC's finding specifically
      targets the pipeline problem — how you build the next generation of consultants
      when the apprenticeship path no longer exists."
    source_items:
    - 'PwC 2026 Global AI Jobs Barometer — PwC (2026)'
    content_angles:
    - The Apprenticeship Just Got Harder
  - theme_id: 4
    theme_title: Uniform Governance Is How Agents Die
    synthesis: 'Gartner predicts 40% of enterprises will demote or decommission autonomous
      AI agents by 2027 due to governance gaps identified after production incidents.
      Only 14.4% of orgs send agents to production with full security approval. The
      failure mode is uniform governance applied indiscriminately across all agent
      actions regardless of risk profile. New this week: W32 covered accountability
      ownership; W33 covered agent identity; this week covers the governance architecture
      failure — differentiation by risk profile is the missing piece.'
    source_items:
    - 'Gartner Says Applying Uniform Governance Across AI Agents Will Lead to Enterprise
      AI Agent Failure — Gartner (2026-05-26)'
    - 'Why Enterprise AI Agents Fail: 2026 Gartner and IDC Data — Beri.net (2026)'
    content_angles:
    - Uniform Governance Is How Agents Die
