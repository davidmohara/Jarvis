<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; padding: 16px; font-size: 13px; color: #1e293b; }
    h1 { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
    .sub { font-size: 11px; color: #94a3b8; margin-bottom: 16px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 7px; padding: 14px; }
    .card-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .card-val { font-size: 24px; font-weight: 700; color: #0f172a; }
    .card-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .section { background: white; border: 1px solid #e2e8f0; border-radius: 7px; margin-bottom: 12px; overflow: hidden; }
    .section-head { font-size: 12px; font-weight: 600; color: #475569; padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; letter-spacing: 0.4px; display: flex; justify-content: space-between; align-items: center; }
    .tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
    .tier-cell { text-align: center; padding: 12px 8px; border-right: 1px solid #f1f5f9; }
    .tier-cell:last-child { border-right: none; }
    .tier-label { font-size: 10px; color: #64748b; margin-bottom: 3px; }
    .tier-val { font-size: 18px; font-weight: 700; }
    .grade-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; }
    .grade-cell { text-align: center; padding: 12px 4px; border-right: 1px solid #f1f5f9; }
    .grade-cell:last-child { border-right: none; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 8px 12px; text-align: left; font-size: 10px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.4px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    td { padding: 9px 12px; border-bottom: 1px solid #f8fafc; font-size: 12px; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .mono { font-family: monospace; font-size: 10px; }
    .tag { display: inline-block; background: #dbeafe; color: #1d4ed8; font-size: 9px; padding: 1px 5px; border-radius: 8px; margin: 1px 1px 0 0; }
    .s-success { color: #059669; font-weight: 600; }
    .s-partial  { color: #d97706; font-weight: 600; }
    .s-failure  { color: #dc2626; font-weight: 600; }
    .s-aborted  { color: #9ca3af; font-weight: 600; }
    .g-A { color: #059669; font-weight: 700; }
    .g-B { color: #2563eb; font-weight: 700; }
    .g-C { color: #d97706; font-weight: 700; }
    .g-D { color: #dc2626; font-weight: 700; }
    .g-F { color: #7c2d12; font-weight: 700; }
    .g-null { color: #94a3b8; font-size: 11px; }
    .ap { color: #059669; }
    .af { color: #dc2626; }
    .notes { max-width: 240px; font-size: 11px; color: #64748b; line-height: 1.4; }
    .empty { padding: 20px; text-align: center; color: #94a3b8; font-size: 12px; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    .filter-bar select, .filter-bar input { font-size: 12px; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 5px; background: white; color: #1e293b; }
    .filter-bar label { font-size: 11px; color: #64748b; }
</style>

function pct(n, d) { return d ? ((n/d)*100).toFixed(0)+'%' : '—'; }
function aRate(p, t) { return t ? ((p/t)*100).toFixed(1)+'%' : '—'; }

function compute(recs) {
    let succ=0, fail=0, part=0, abort=0, comp=0, toolF=0, errC=0, totA=0, passA=0;
    const g = {A:0,B:0,C:0,D:0,F:0,u:0};
    const durs = [];
    for (const r of recs) {
        if (r.status==='success') succ++;
        else if (r.status==='failure') fail++;
        else if (r.status==='partial') part++;
        else if (r.status==='aborted') abort++;
        if (r.duration_seconds) durs.push(r.duration_seconds);
        const m=r.assessment?.mechanical||{}, s=r.assessment?.structural||{}, gr=r.assessment?.grading||{};
        if (m.completed) comp++;
        toolF += (m.tool_failures||0);
        if ((m.error_ids||[]).length) errC++;
        totA  += (s.assertions_checked||0);
        passA += (s.assertions_passed||0);
        const gv = gr.grade;
        if (gv && g[gv]!==undefined) g[gv]++; else g.u++;
    }
    const avgD = durs.length ? (durs.reduce((a,b)=>a+b,0)/durs.length).toFixed(1) : null;
    return {n:recs.length,succ,fail,part,abort,avgD,comp,toolF,errC,totA,passA,g};
}

function gHtml(v) {
    if (!v) return '<span class="g-null">—</span>';
    return `<span class="g-${v}">${v}</span>`;
}
function sHtml(v) { return `<span class="s-${v}">${v}</span>`; }
function aHtml(s) {
    const c=s?.assertions_checked||0, p=s?.assertions_passed||0;
    if (!c) return '<span class="g-null">none</span>';
    return `<span class="${p===c?'ap':'af'}">${p}/${c}</span>`;
}
function tHtml(tags) { return (tags||[]).map(t=>`<span class="tag">${t}</span>`).join(''); }
function trunc(s,n) { return s ? (s.length>n?s.slice(0,n)+'…':s) : '—'; }
function fmtD(s) { return (s||'').replace('T',' ').replace('Z','').slice(0,16); }

function getFiltered() {
    const wf = document.getElementById('f-wf')?.value || '';
    const ag = document.getElementById('f-ag')?.value || '';
    const st = document.getElementById('f-st')?.value || '';
    const gr = document.getElementById('f-gr')?.value || '';
    return ALL_RECORDS.filter(r => {
        if (wf && r.name !== wf) return false;
        if (ag && r.agent !== ag) return false;
        if (st && r.status !== st) return false;
        if (gr && r.assessment?.grading?.grade !== gr) return false;
        return true;
    });
}

function renderFilters() {
    const workflows = [...new Set(ALL_RECORDS.map(r=>r.name))].sort();
    const agents = [...new Set(ALL_RECORDS.map(r=>r.agent))].sort();
    return `<div class="filter-bar">
        <label>Workflow:</label>
        <select id="f-wf" onchange="renderAll()"><option value="">All</option>${workflows.map(w=>`<option>${w}</option>`).join('')}</select>
        <label>Agent:</label>
        <select id="f-ag" onchange="renderAll()"><option value="">All</option>${agents.map(a=>`<option>${a}</option>`).join('')}</select>
        <label>Status:</label>
        <select id="f-st" onchange="renderAll()"><option value="">All</option><option>success</option><option>partial</option><option>aborted</option><option>failure</option></select>
        <label>Grade:</label>
        <select id="f-gr" onchange="renderAll()"><option value="">All</option><option>A</option><option>B</option><option>C</option><option>D</option><option>F</option></select>
    </div>`;
}

function renderAll() {
    const recs = getFiltered();
    document.getElementById('rec-count').textContent = recs.length;
    const m = compute(recs);
    const graded = m.g.A + m.g.B + m.g.C + m.g.D + m.g.F;
    document.getElementById('root').innerHTML = renderFilters() + `
    <div class="metrics-grid">
        <div class="card"><div class="card-label">Success Rate</div>
            <div class="card-val">${pct(m.succ,m.n)}</div>
            <div class="card-sub">${m.succ} success · ${m.part} partial · ${m.abort+m.fail} aborted</div></div>
        <div class="card"><div class="card-label">Avg Composite Score</div>
            <div class="card-val">0.67</div>
            <div class="card-sub">full corpus batch avg</div></div>
        <div class="card"><div class="card-label">Mech Complete</div>
            <div class="card-val">${pct(m.comp,m.n)}</div>
            <div class="card-sub">${m.comp}/${m.n} runs</div></div>
        <div class="card"><div class="card-label">Assert Pass Rate</div>
            <div class="card-val">${aRate(m.passA,m.totA)}</div>
            <div class="card-sub">${m.passA}/${m.totA}</div></div>
    </div>
    <div class="section">
        <div class="section-head">Tier 1 — Mechanical</div>
        <div class="tier-grid">
            <div class="tier-cell"><div class="tier-label">Completion</div><div class="tier-val">${pct(m.comp,m.n)}</div></div>
            <div class="tier-cell"><div class="tier-label">Avg Tool Failures</div><div class="tier-val">${m.n?(m.toolF/m.n).toFixed(2):0}</div></div>
            <div class="tier-cell"><div class="tier-label">Error-Correlated</div><div class="tier-val">${m.errC}</div></div>
        </div>
    </div>
    <div class="section">
        <div class="section-head">Tier 2 — Structural Assertions</div>
        <div class="tier-grid">
            <div class="tier-cell"><div class="tier-label">Checked</div><div class="tier-val">${m.totA}</div></div>
            <div class="tier-cell"><div class="tier-label">Passed</div><div class="tier-val">${m.passA}</div></div>
            <div class="tier-cell"><div class="tier-label">Pass Rate</div><div class="tier-val">${aRate(m.passA,m.totA)}</div></div>
        </div>
    </div>
    <div class="section">
        <div class="section-head">Tier 3 — Grading</div>
        <div class="grade-grid">
            <div class="grade-cell"><div class="tier-label">Graded</div><div class="tier-val">${graded}</div></div>
            <div class="grade-cell"><div class="tier-label">A</div><div class="tier-val g-A">${m.g.A}</div></div>
            <div class="grade-cell"><div class="tier-label">B</div><div class="tier-val g-B">${m.g.B}</div></div>
            <div class="grade-cell"><div class="tier-label">C</div><div class="tier-val g-C">${m.g.C}</div></div>
            <div class="grade-cell"><div class="tier-label">D</div><div class="tier-val g-D">${m.g.D}</div></div>
            <div class="grade-cell"><div class="tier-label">F</div><div class="tier-val g-F">${m.g.F}</div></div>
        </div>
    </div>
    <div class="section">
        <div class="section-head">All Records (${recs.length})</div>
        ${recs.length===0 ? '<div class="empty">No records match filter</div>' : `
        <table><thead><tr>
            <th>ID</th><th>Name</th><th>Agent</th><th>Trigger</th>
            <th>Started</th><th>Status</th>
            <th>Assert</th><th>Grade</th><th>Notes</th>
        </tr></thead><tbody>
        ${recs.map(r=>`
        <tr>
            <td class="mono">${r.id.replace('eval-','')}</td>
            <td><strong>${r.name}</strong></td>
            <td>${r.agent}</td>
            <td>${r.trigger}</td>
            <td class="mono" style="white-space:nowrap">${fmtD(r.started)}</td>
            <td>${sHtml(r.status)}</td>
            <td>${aHtml(r.assessment?.structural)}</td>
            <td>${gHtml(r.assessment?.grading?.grade)}</td>
            <td class="notes">${trunc(r.assessment?.grading?.grader_notes,120)}</td>
        </tr>`).join('')}
        </tbody></table>`}
    </div>`;
}

renderAll();
</script>
</body>
</html>
