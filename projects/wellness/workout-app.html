<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Workout">
<title>Workout</title>
<style>
:root{--bl:#1a73e8;--bll:#e8f0fe;--bld:#1557b0;--gr:#1e8e3e;--grl:#e6f4ea;--am:#e37400;--aml:#fef3e2;--pu:#7c3aed;--pul:#ede9fe;--g1:#202124;--g2:#3c4043;--g3:#5f6368;--g4:#9aa0a6;--g5:#dadce0;--g6:#f1f3f4;--g7:#f8f9fa;--wh:#fff;--ra:12px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,16px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--g7);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:var(--g1)}
nav{display:flex;background:var(--wh);border-bottom:1px solid var(--g5);position:fixed;top:0;left:0;right:0;z-index:100;padding-top:var(--st)}
.nt{flex:1;padding:12px 4px 10px;text-align:center;font-size:11px;color:var(--g4);border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nt svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nt.on{color:var(--bl)}
.sc{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(16px + var(--sb))}
.sc.on{display:block}
::-webkit-scrollbar{display:none}
.btog{display:flex;background:var(--g6);border-radius:10px;padding:3px;margin-bottom:12px;gap:2px}
.bb{flex:1;padding:7px;border:none;border-radius:8px;background:transparent;font-size:13px;font-weight:500;color:var(--g3);cursor:pointer}
.bb.on{background:var(--wh);color:var(--g1);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dh{background:var(--wh);border-radius:var(--ra);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dt{font-size:17px;font-weight:600}
.ds{font-size:13px;color:var(--g3);margin-top:2px}
.db{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:500;white-space:nowrap}
.bs{background:var(--bll);color:var(--bl)}
.bh{background:var(--grl);color:var(--gr)}
.bm{background:var(--aml);color:var(--am)}
.bk{background:var(--pul);color:var(--pu)}
.nub{background:var(--g1);color:var(--wh);border-radius:var(--ra);padding:10px 14px;margin-bottom:10px;font-size:13px}
.nub strong{font-size:14px}
.ec{background:var(--wh);border-radius:var(--ra);margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.ec.dc{opacity:.5}
.ec.nc{border-left:3px solid var(--pu)}
.ech{display:flex;align-items:center;gap:12px;padding:14px 14px 0}
.ei{width:50px;height:50px;border-radius:8px;background:var(--g6);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.en{font-size:16px;font-weight:600;line-height:1.2}
.em{font-size:13px;color:var(--g3);margin-top:3px}
.etg{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.etg span{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--g6);color:var(--g3)}
.etg .nt2{background:var(--pul);color:var(--pu)}
.edsc{font-size:14px;color:var(--g2);line-height:1.55;padding:10px 14px;border-top:1px solid var(--g6);margin-top:10px}
.emc{font-size:12px;color:var(--g3);padding:0 14px 8px}
.emc span{font-weight:500;color:var(--g2)}
.etp{font-size:12px;background:var(--bll);color:var(--bld);border-radius:6px;padding:7px 10px;margin:0 14px 10px;line-height:1.4}
.st{padding:8px 14px 12px;border-top:1px solid var(--g6)}
.stl{font-size:11px;color:var(--g3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.srs{display:flex;flex-direction:column;gap:6px}
.sr{display:flex;align-items:center;gap:8px}
.sn{font-size:13px;color:var(--g3);width:36px;flex-shrink:0}
.si{flex:1;height:36px;border:1px solid var(--g5);border-radius:8px;text-align:center;font-size:15px;background:var(--g7);color:var(--g1);min-width:0}
.si:focus{outline:none;border-color:var(--bl);background:var(--wh)}
.sx{font-size:14px;color:var(--g4);flex-shrink:0}
.sch{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--g5);background:var(--wh);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.sch.on{background:var(--gr);border-color:var(--gr)}
.sch svg{width:15px;height:15px;stroke:var(--g4);stroke-width:2.5;fill:none}
.sch.on svg{stroke:var(--wh)}
.dnb{display:block;margin:6px 14px 12px;width:calc(100% - 28px);padding:11px;border-radius:8px;border:none;font-size:15px;font-weight:600;cursor:pointer;background:var(--bl);color:var(--wh)}
.rb{background:var(--bll);border-radius:8px;margin:0 14px 12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.rl{font-size:13px;color:var(--bl);font-weight:500}
.rt{font-size:20px;font-weight:700;color:var(--bl);font-variant-numeric:tabular-nums}
.rsk{font-size:13px;color:var(--bl);background:none;border:none;cursor:pointer}
.cb{background:var(--gr);color:var(--wh);border-radius:var(--ra);padding:18px;text-align:center;margin-bottom:12px}
.cb h2{font-size:22px;font-weight:700}
.cb p{font-size:14px;opacity:.9;margin-top:4px}
.bigb{display:block;width:100%;padding:14px;border-radius:var(--ra);border:none;font-size:16px;font-weight:600;cursor:pointer;background:var(--bl);color:var(--wh);margin-bottom:10px;text-align:center}
.bigb.sec{background:var(--g5);color:var(--g1)}
.sl{background:var(--wh);border-radius:var(--ra);padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sr2{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--g6)}
.sr2:last-child{border-bottom:none;padding-bottom:0}
.se{font-size:20px;width:32px;text-align:center;flex-shrink:0}
.sna{font-size:14px;font-weight:500}
.sme{font-size:12px;color:var(--g3)}
.np{font-size:10px;background:#ede9fe;color:#7c3aed;padding:1px 6px;border-radius:10px;font-weight:600;margin-left:4px;display:inline-block}
.lc{background:var(--wh);border-radius:var(--ra);padding:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ld{font-size:15px;font-weight:600}
.lday{font-size:13px;color:var(--g3);margin-top:2px}
.lm{font-size:13px;color:var(--g3);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.ln{font-size:13px;color:var(--g2);margin-top:6px;font-style:italic}
.delb{float:right;background:none;border:none;color:var(--g4);font-size:22px;cursor:pointer;line-height:1}
.sgr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sti{background:var(--wh);border-radius:var(--ra);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stib{font-size:12px;color:var(--g3);margin-bottom:4px}
.stiv{font-size:26px;font-weight:700;color:var(--g1)}
.qc{background:var(--wh);border-radius:var(--ra);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.qn{width:28px;height:28px;border-radius:50%;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qi{flex:1}
.qna{font-size:15px;font-weight:600}
.qsu{font-size:13px;color:var(--g3);margin-top:2px}
.sectit{font-size:12px;font-weight:600;color:var(--g3);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px}
.emp{text-align:center;padding:40px 20px;color:var(--g4);font-size:15px}
</style>
</head>

var B={
1:[
{n:'Day 1 — Heavy Strength',sn:'Heavy Strength',b:'Strength',bc:'bs',e:[
{n:'Movement Prep',s:1,r:'10 min',l:'—',p:'mobility',em:'🔄',mu:'Hip flexors, T-spine, Shoulders',d:'Hip flexor stretch 60s each side, thoracic spine rotations on foam roller, shoulder CARs — full slow circles through complete shoulder range. Non-negotiable given shoulder history.'},
{n:'Trap Bar Deadlift',s:4,r:'4–5',l:'~240 lbs, +10/wk',p:'hip hinge',em:'🏋️',mu:'Glutes, Hamstrings, Quads / Erectors, Traps',d:'Stand center of trap bar. Hinge at hips, neutral spine, chest up. Drive through the floor — push the floor away. Lock out hips at top. Preferred over conventional: better for 6\'3" frame, protects left foot under heavy load.',tip:'Target: add 10 lbs/week for first 4 weeks. Week 1: 240, Week 2: 250, Week 3: 260, Week 4: 270.'},
{n:'Goblet Squat',s:3,r:'6–8',l:'Moderate KB',p:'squat',em:'🔔',mu:'Quads, Glutes / Core, Upper back',d:'KB at chest, elbows inside knees at bottom. Sit back and down — not just down. Drive knees out. Full depth as mobility allows. Builds squat pattern safely while monitoring ACL tracking.'},
{n:'Chest-Supported DB Row',s:3,r:'8–10',l:'Moderate DB',p:'horizontal pull',em:'🏋️',mu:'Mid traps, Rhomboids, Lats / Rear delts, Biceps',d:'Incline bench ~45°. Chest on pad, feet on floor. Row both DBs to hips — lead with elbows. Pause 1s at top. Chest support eliminates lower back involvement and is safe for both shoulder repairs.'},
{n:'Single-Leg RDL',s:3,r:'8 each side',l:'Light DB or bodyweight',p:'unilateral',em:'🦵',mu:'Hamstrings, Glutes / Balance, Hip stabilizers',d:'Stand on one leg. Hinge forward flat back, free leg extends behind. Touch DB to floor or shin. Addresses left/right DEXA asymmetry. Start bodyweight — balance is the challenge.'},
{n:'Rowing Ergometer',s:1,r:'10 min',l:'Easy pace',p:'conditioning',em:'🚣',mu:'Lats, Rhomboids, Hamstrings / Quads, Core',d:'Legs to hips to arms on the drive. Arms to hips to legs on recovery. 22–24 strokes/min, easy effort. Zero foot impact — ideal given Jones fracture history.'}
]},
{n:'Day 2 — Hypertrophy',sn:'Hypertrophy',b:'Hypertrophy',bc:'bh',e:[
{n:'Movement Prep',s:1,r:'10 min',l:'—',p:'mobility',em:'🔄',mu:'Hip flexors, T-spine, Shoulders',d:'Hip flexor stretch 60s each side, thoracic spine rotations, shoulder CARs. Same as Day 1 — always do this before loading.'},
{n:'Landmine Press',s:3,r:'10–12 each',l:'Moderate plate',p:'horizontal push',em:'💪',mu:'Anterior delt, Upper chest / Triceps, Serratus',d:'Anchor barbell in corner or landmine. Press from shoulder height at ~45°. Neutral grip arc — the key shoulder-safe pressing variation. Takes shoulder out of impingement zone. Split stance for stability.'},
{n:'Bulgarian Split Squat',s:3,r:'10 each side',l:'Bodyweight to DB',p:'unilateral',em:'🦵',mu:'Quads, Glutes / Hamstrings, Hip flexors',d:'Rear foot on bench, front foot 2–3 feet forward. Lower until front thigh parallel. Front shin vertical. Directly addresses left/right leg asymmetry from DEXA. ACL-safe.'},
{n:'Eccentric Pull-Up / Cable Pulldown',s:3,r:'5–6 eccentric OR 10–12 pulldown',l:'Bodyweight / Moderate stack',p:'vertical pull',em:'🏋️',mu:'Lats, Teres major / Biceps, Rear delts',d:'ECCENTRIC: Stand on box, neutral grip. Jump to top — chin over bar. Lower under control for 4–6 seconds to dead hang. You are 20–30% stronger eccentrically. PULLDOWN: Neutral grip V-bar, pull to upper chest, lead elbows down and back. Alternate across sessions.',tip:'Goal: bodyweight pull-up. Grip strength is a top longevity predictor (Lancet 2015).',isN:true},
{n:'Incline DB Press',s:3,r:'10–12',l:'Moderate DB',p:'horizontal push',em:'💪',mu:'Upper chest, Anterior delt / Triceps',d:'Bench at 30–45°. Feet flat. Elbows at ~45° from torso. Full range. Stop if you feel shoulder impingement — reduce range or angle.'},
{n:'Face Pull / Band Pull-Apart Superset',s:3,r:'15–20 each',l:'Light cable / band',p:'rotator cuff',em:'🎯',mu:'Rear delts, External rotators / Mid traps, Rhomboids',d:'Face pull: cable at face height, rope, pull to forehead with external rotation — show your biceps at end. Immediately follow with band pull-apart: arms straight, pull to chest width. Protects both shoulder repairs. Never skip.'},
{n:'Half-Kneeling Pallof Press',s:3,r:'8–10 each side',l:'Light cable',p:'anti-rotation core',em:'🎯',mu:'Obliques, Deep core / Glutes, Hip stabilizers',d:'Half-kneeling perpendicular to cable, inside knee down. Cable at chest height. Press straight out and hold 2 seconds — resist rotation the entire time. Pull back in. Anti-rotation work is the missing piece for long-term spine health.',tip:'From the Evernote archive. Protects lumbar spine and improves transfer to deadlift and carry.',isN:true},
{n:'Farmer Carry',s:3,r:'35 meters',l:'~50 lbs/hand to start',p:'loaded carry',em:'💼',mu:'Grip, Traps, Core / Glutes, Quads',d:'Two KBs, stand tall, walk controlled line. Head up, shoulders packed. Strong grip throughout. Conservative load given left foot history — drop if any foot discomfort.'},
{n:'Rowing Ergometer',s:1,r:'10 min',l:'Moderate pace',p:'conditioning',em:'🚣',mu:'Full body — posterior chain dominant',d:'24–26 strokes/min, moderate effort. Should be able to hold a broken conversation.'}
]},
{n:'Day 3 — Power/Metabolic',sn:'Power & Metabolic',b:'Metabolic',bc:'bm',e:[
{n:'Movement Prep',s:1,r:'5 min',l:'—',p:'mobility',em:'🔄',mu:'Hip flexors, Glutes, Shoulders',d:'Hip circles, leg swings, arm circles. Shorter prep for the metabolic session.'},
{n:'KB Swing',s:5,r:'10',l:'35–53 lbs KB',p:'hip hinge power',em:'🏋️',mu:'Glutes, Hamstrings / Core, Lats',d:'Hip hinge — not a squat. Drive hips forward explosively to float the bell to chest height. Hike it back between legs, load the hips. Speed and hip drive matter more than load. Stand on both feet — protects left foot.'},
{n:'Sled Push',s:4,r:'20 meters',l:'Moderate — start light',p:'metabolic',em:'🛷',mu:'Quads, Glutes, Calves / Core, Shoulders',d:'Lean into sled ~45°, drive through floor with short powerful steps. No eccentric load — best recovery cost-benefit ratio of any exercise. Best tool for VAT reduction alongside Zone 2 cardio.'},
{n:'Step-Up',s:3,r:'10 each side',l:'Bodyweight to DB',p:'unilateral',em:'🫜',mu:'Glutes, Quads / Hamstrings, Balance',d:'Box or bench ~16". Step up, drive through heel of top foot — don\'t push off back foot. Stand fully at top. Step down controlled. ACL and foot-friendly.'},
{n:'TRX Row',s:3,r:'12',l:'Body angle',p:'horizontal pull',em:'🏋️',mu:'Mid traps, Rhomboids, Rear delts / Biceps',d:'Lean back, straight body. Pull chest to hands — elbows back, shoulder blades squeeze. More horizontal = harder.'},
{n:'Rowing Ergometer Intervals',s:3,r:'4 min on / 2 off',l:'Zone 2',p:'conditioning',em:'🚣',mu:'Full body',d:'Zone 2: can talk but would rather not. ~65–75% max HR. Primary VAT burner. Three 4-minute intervals beats one long cruise.'}
]}
],
2:[

{n:'Movement Prep',s:1,r:'10 min',l:'—',p:'mobility',em:'🔄',mu:'Hip flexors, T-spine, Shoulders',d:'Same as Block 1. Hip flexor stretch, thoracic rotations, shoulder CARs.'},
{n:'Romanian Deadlift',s:4,r:'5–6',l:'Moderate barbell, +10/wk',p:'hip hinge',em:'🏋️',mu:'Hamstrings, Glutes / Erectors, Traps',d:'Barbell from rack or floor. Hinge to just below the knee — feel the hamstring stretch. Drive hips forward to lockout. Greater hamstring emphasis than trap bar.',tip:'Block 2 swap for trap bar deadlift. Same hip hinge pattern, different loading arc.'},
{n:'Safety Bar or Heel-Elevated Goblet Squat',s:3,r:'6–8',l:'Moderate',p:'squat',em:'🔔',mu:'Quads, Glutes / Core',d:'Safety bar: more upright torso, easier on shoulders. Heel-elevated goblet: 1–2 inch plates under heels, dramatically improves depth and quad emphasis.',tip:'Heel elevation is a plateau-breaker for quad development.'},
{n:'Barbell Row (Pendlay)',s:3,r:'6–8',l:'Moderate barbell',p:'horizontal pull',em:'🏋️',mu:'Lats, Mid traps, Rhomboids / Erectors, Biceps',d:'Bar on floor each rep. Hinge to near-horizontal back. Pull bar to lower chest — elbows close. Reset to floor. Full stop eliminates momentum.',tip:'Block 2 swap for chest-supported row. Monitor lower back — drop to chest-supported if form slips.'},
{n:'Reverse Lunge',s:3,r:'8–10 each side',l:'DB or KB',p:'unilateral',em:'🦵',mu:'Glutes, Quads / Hamstrings, Balance',d:'Step back — not forward. Rear knee drops to just above floor. Front shin stays vertical. ACL-safer than forward lunge and easier on the Jones fracture side.'},
{n:'Rowing Ergometer',s:1,r:'10 min',l:'Easy–Moderate',p:'conditioning',em:'🚣',mu:'Full body, posterior chain dominant',d:'22–26 strokes/min. Push a bit harder than Block 1.'}
]},
{n:'Day 2 — Hypertrophy (B2)',sn:'Hypertrophy B2',b:'Hypertrophy',bc:'bh',e:[
{n:'Movement Prep',s:1,r:'10 min',l:'—',p:'mobility',em:'🔄',mu:'Hip flexors, T-spine, Shoulders',d:'Same as Block 1.'},
{n:'Dumbbell Z-Press',s:3,r:'8–10 each',l:'Light–Moderate DB',p:'overhead push',em:'💪',mu:'Anterior delt, Triceps / Core, Serratus',d:'Sit on floor, legs straight. Press DBs overhead from shoulder height. Floor position eliminates leg drive, forces true shoulder strength.',tip:'Block 2 swap for landmine press. Lower weight is expected and correct.'},
{n:'Walking Lunge',s:3,r:'10 each side',l:'DB or bodyweight',p:'unilateral',em:'🦵',mu:'Quads, Glutes / Hamstrings, Balance',d:'Step forward, drive through front heel to standing, step through into next lunge. Monitor left foot on impact — reduce load if any discomfort.'},
{n:'Weighted or Eccentric Pull-Up',s:3,r:'4–6 or 5 eccentric',l:'Bodyweight or added weight',p:'vertical pull',em:'🏋️',mu:'Lats, Teres major / Biceps, Rear delts',d:'Block 2 progression. If you can do 3–4 bodyweight reps, do those then switch to eccentric. If not, continue eccentric-only 5-second lowering.',tip:'Goal by week 8: at least one clean bodyweight neutral-grip pull-up.'},
{n:'Cable Fly',s:3,r:'12–15',l:'Light cable',p:'chest isolation',em:'💪',mu:'Pectorals / Anterior delt',d:'Cables at shoulder height. Step forward, slight lean. Bring handles together in front of chest — slight elbow bend. Slow on the way back.'},
{n:'Half-Kneeling Face Pull',s:3,r:'12–15',l:'Light cable',p:'rotator cuff',em:'🎯',mu:'Rear delts, External rotators / Mid traps',d:'Half-kneeling facing cable. Pull rope to face with external rotation — elbows high, show your biceps at end. Half-kneeling increases core and glute demand.',isN:true},
{n:'Pallof Press (Standing)',s:3,r:'10 each side',l:'Light–Moderate cable',p:'anti-rotation core',em:'🎯',mu:'Obliques, Transverse abdominis / Glutes',d:'Stand perpendicular to cable, feet shoulder width. Press straight out from chest, hold 2 seconds, return. Standing version increases demand vs. half-kneeling Block 1 version.'},
{n:'Suitcase Carry',s:3,r:'35 meters each side',l:'~50–60 lbs KB',p:'loaded carry',em:'💼',mu:'Obliques, Grip, Traps / Glutes, Core',d:'Single KB in one hand, walk tall. Unilateral load drives lateral core anti-flexion. Harder than farmer carry for core demand.',tip:'Block 2 swap for bilateral farmer carry. Builds lateral spine stiffness.'},
{n:'Rowing Ergometer',s:1,r:'10 min',l:'Moderate–Hard',p:'conditioning',em:'🚣',mu:'Full body',d:'26–28 strokes/min. Push the effort up a notch from Block 1.'}
]},
{n:'Day 3 — KB Conditioner (B2)',sn:'KB Conditioner',b:'KB Circuit',bc:'bk',e:[
{n:'Movement Prep',s:1,r:'5 min',l:'—',p:'mobility',em:'🔄',mu:'Hip flexors, Glutes, Shoulders',d:'Hip circles, leg swings, arm circles, shoulder rolls.'},
{n:'One-Arm KB Clean',s:4,r:'10–12 each side',l:'Moderate KB',p:'power',em:'🏋️',mu:'Glutes, Traps, Forearm / Core, Lats',d:'KB between feet, hinge. Drive hips — punch the KB up and catch in rack position (KB resting on forearm, elbow tucked). Power comes from hip drive, not your arm.',tip:'From your Evernote KB Conditioner archive.'},
{n:'Double-Arm KB Swing',s:4,r:'12–15',l:'Moderate KB',p:'hip hinge power',em:'🏋️',mu:'Glutes, Hamstrings / Core, Lats',d:'Both hands on KB. Same hip-hinge drive as single-arm swing — double handle allows a heavier bell. Float to chest height, load hips on backswing.'},
{n:'Goblet Squat (KB)',s:4,r:'10–12',l:'Moderate–Heavy KB',p:'squat',em:'🔔',mu:'Quads, Glutes / Core, Upper back',d:'KB at chest, elbows inside knees. In circuit context, focus on speed and depth, not max strength.'},
{n:'One-Arm KB Overhead Press',s:3,r:'8–10 each side',l:'Light–Moderate KB',p:'overhead push',em:'💪',mu:'Deltoids, Triceps / Core, Rotator cuff',d:'KB in rack position. Press straight overhead — full lockout if shoulder allows. KB wrist rotation is more shoulder-friendly than barbell. Monitor both shoulders.',tip:'Watch the shoulder repairs. Light weight, perfect form, full range only if pain-free.'},
{n:'Reverse Lunge (Contralateral KB)',s:3,r:'10 each side',l:'Moderate KB',p:'unilateral',em:'🦵',mu:'Glutes, Quads / Hamstrings, Core',d:'Hold KB in opposite hand to stepping leg (right leg steps back = KB in left hand). Contralateral load increases core demand significantly.'},
{n:'Rowing Ergometer Intervals',s:3,r:'4 min on / 2 off',l:'Zone 2–3',p:'conditioning',em:'🚣',mu:'Full body',d:'Push into low Zone 3 by Block 2 — ~70–80% max HR.'}
]}
]
};

function gd(){try{return JSON.parse(localStorage.getItem(SK))||[];}catch(e){return[];}}
function sd(d){try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}}
function ndi(){var d=gd();if(!d.length)return 0;return(d[0].di+1)%3;}
function cd(){return B[cb];}

// Event delegation — one listener, no inline onclick
document.body.addEventListener('click',function(e){
  var t=e.target;
  // Walk up to find data-action
  while(t&&t!==document.body){
    var a=t.getAttribute('data-a');
    if(a){
      e.preventDefault();
      handle(a,t);
      return;
    }
    t=t.parentElement;
  }
});

function handle(a,el){
  if(a==='tab'){switchTab(el.getAttribute('data-t'));return;}
  if(a==='blk'){setBlock(parseInt(el.getAttribute('data-v')));return;}
  if(a==='start'){initWorkout();return;}
  if(a==='done'){markDone(parseInt(el.getAttribute('data-i')));return;}
  if(a==='skip'){stopRest();return;}
  if(a==='save'){saveAndFinish(parseInt(el.getAttribute('data-i')));return;}
  if(a==='back'){wf=false;renderW();return;}
  if(a==='chk'){toggleSet(parseInt(el.getAttribute('data-i')),parseInt(el.getAttribute('data-s')));return;}
  if(a==='del'){delEntry(parseInt(el.getAttribute('data-i')));return;}
}

// Input changes via event delegation on inputs
document.body.addEventListener('change',function(e){
  var t=e.target;
  if(t.getAttribute('data-inp')==='load'){setLoad(parseInt(t.getAttribute('data-i')),parseInt(t.getAttribute('data-s')),t.value);}
  if(t.getAttribute('data-inp')==='reps'){setReps(parseInt(t.getAttribute('data-i')),parseInt(t.getAttribute('data-s')),t.value);}
});

function switchTab(name){
  document.querySelectorAll('.sc').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.nt').forEach(function(t){t.classList.remove('on');});
  document.getElementById('s'+name[0]).classList.add('on');
  document.getElementById('tab-'+name).classList.add('on');
  if(name==='log')renderL();
  if(name==='queue')renderQ();
  if(name==='workout')renderW();
}

// Wire up nav tabs
document.getElementById('tab-workout').setAttribute('data-a','tab');
document.getElementById('tab-workout').setAttribute('data-t','workout');
document.getElementById('tab-queue').setAttribute('data-a','tab');
document.getElementById('tab-queue').setAttribute('data-t','queue');
document.getElementById('tab-log').setAttribute('data-a','tab');
document.getElementById('tab-log').setAttribute('data-t','log');

function setBlock(n){cb=n;localStorage.setItem(BK,n);ws=false;wf=false;renderW();}

function btog(){
  var d=document.createElement('div');d.className='btog';
  [1,2].forEach(function(n){
    var btn=document.createElement('button');
    btn.className='bb'+(cb===n?' on':'');
    btn.textContent=n===1?'Block 1 — Jun/Jul':'Block 2 — Aug/Sep';
    btn.setAttribute('data-a','blk');btn.setAttribute('data-v',n);
    d.appendChild(btn);
  });
  return d;
}

function initWorkout(){
  var di=ndi();ci=0;ss={};ce=new Set();ws=true;wf=false;wt=Date.now();
  var day=cd()[di];
  day.e.forEach(function(ex,i){
    var rows=[];for(var s=0;s<Math.max(ex.s,1);s++)rows.push({l:'',r:'',done:false});
    ss[i]=rows;
  });
  renderW();
}

function renderW(){
  var di=ndi(),day=cd()[di],scr=document.getElementById('sw');
  while(scr.firstChild)scr.removeChild(scr.firstChild);
  scr.appendChild(btog());

  if(!ws){
    // Start screen
    var dh=mk('div','dh');
    var dl=mk('div');dl.appendChild(mkT('div','dt',day.sn));dl.appendChild(mkT('div','ds',day.e.length+' exercises · Block '+cb));
    var db=mkT('span','db '+day.bc,day.b);
    dh.appendChild(dl);dh.appendChild(db);scr.appendChild(dh);

    var sl=mk('div','sl');
    day.e.forEach(function(ex){
      var row=mk('div','sr2');
      var em=mkT('div','se',ex.em);
      var info=mk('div');
      var na=mk('div','sna');na.textContent=ex.n;
      if(ex.isN){var np=mkT('span','np','NEW');na.appendChild(np);}
      var me=mkT('div','sme',(ex.s===1?ex.r:ex.s+' x '+ex.r)+' · '+ex.p);
      info.appendChild(na);info.appendChild(me);
      row.appendChild(em);row.appendChild(info);sl.appendChild(row);
    });
    scr.appendChild(sl);

    var btn=mk('button','bigb');btn.textContent='▶  Start Workout';btn.setAttribute('data-a','start');
    scr.appendChild(btn);
    return;
  }

  if(wf){
    var dur=Math.round((Date.now()-wt)/60000);
    var cb2=mk('div','cb');
    var h2=mk('h2');h2.textContent='✓ Workout done';
    var p=mk('p');p.textContent=day.sn+' · '+dur+' min · '+ce.size+'/'+day.e.length+' exercises';
    cb2.appendChild(h2);cb2.appendChild(p);scr.appendChild(cb2);
    var b1=mk('button','bigb');b1.textContent='Save and finish';b1.setAttribute('data-a','save');b1.setAttribute('data-i',di);
    var b2=mk('button','bigb sec');b2.textContent='Back to review';b2.setAttribute('data-a','back');
    scr.appendChild(b1);scr.appendChild(b2);
    return;
  }

  var dh2=mk('div','dh');
  var dl2=mk('div');dl2.appendChild(mkT('div','dt',day.sn));dl2.appendChild(mkT('div','ds',ce.size+'/'+day.e.length+' done'));
  dh2.appendChild(dl2);dh2.appendChild(mkT('span','db '+day.bc,day.b));
  scr.appendChild(dh2);

  var nx=day.e[ci+1];
  if(nx){var nb=mk('div','nub');nb.innerHTML='&#8594; Up next: <strong>'+nx.n+'</strong> · '+(nx.s===1?nx.r:nx.s+'x'+nx.r);scr.appendChild(nb);}

  day.e.forEach(function(ex,i){scr.appendChild(renderCard(ex,i,di));});

  var sp=mk('div');sp.style.height='20px';scr.appendChild(sp);

  setTimeout(function(){
    var cards=scr.querySelectorAll('.ec');
    if(cards[ci])cards[ci].scrollIntoView({behavior:'smooth',block:'start'});
  },80);
}

function renderCard(ex,i,di){
  var isDone=ce.has(i),isCur=i===ci;
  var card=mk('div','ec'+(isDone?' dc':'')+(ex.isN?' nc':''));
  card.id='ec'+i;

  var head=mk('div','ech');
  head.appendChild(mkT('div','ei',ex.em));
  var info=mk('div');info.style.flex='1';info.style.minWidth='0';
  info.appendChild(mkT('div','en',(isDone?'✓ ':'')+ex.n));
  info.appendChild(mkT('div','em',(ex.s===1?ex.r:ex.s+' sets x '+ex.r)+' · '+ex.l));
  var tg=mk('div','etg');
  tg.appendChild(mkT('span','',ex.p));
  if(ex.isN)tg.appendChild(mkT('span','nt2','new this block'));
  info.appendChild(tg);
  head.appendChild(info);
  card.appendChild(head);

  if(isCur||isDone){
    card.appendChild(mkT('div','edsc',ex.d));
    card.appendChild(mkHTML('div','emc','Muscles: <span>'+ex.mu+'</span>'));
    if(ex.tip)card.appendChild(mkT('div','etp',ex.tip));

    if(ex.s>1){
      var st=mk('div','st');
      st.appendChild(mkT('div','stl','Track your sets'));
      var srs=mk('div','srs');
      (ss[i]||[]).forEach(function(s,si){
        var row=mk('div','sr');
        row.appendChild(mkT('span','sn','Set '+(si+1)));
        var linp=document.createElement('input');
        linp.className='si';linp.type='number';linp.inputMode='decimal';linp.placeholder='lbs';linp.value=s.l||'';
        linp.setAttribute('data-inp','load');linp.setAttribute('data-i',i);linp.setAttribute('data-s',si);
        linp.style.maxWidth='75px';
        row.appendChild(linp);
        row.appendChild(mkT('span','sx','x'));
        var rinp=document.createElement('input');
        rinp.className='si';rinp.type='number';rinp.inputMode='numeric';rinp.placeholder='reps';rinp.value=s.r||'';
        rinp.setAttribute('data-inp','reps');rinp.setAttribute('data-i',i);rinp.setAttribute('data-s',si);
        rinp.style.maxWidth='65px';
        row.appendChild(rinp);
        var chk=mk('button','sch'+(s.done?' on':''));
        chk.setAttribute('data-a','chk');chk.setAttribute('data-i',i);chk.setAttribute('data-s',si);
        chk.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="'+(s.done?'white':'#dadce0')+'" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
        row.appendChild(chk);
        srs.appendChild(row);
      });
      st.appendChild(srs);card.appendChild(st);
    }

    if(rt!==null&&isCur){
      var rb=mk('div','rb');
      rb.appendChild(mkT('span','rl','Rest'));
      var rtd=mkT('span','rt',fmt(rs));rtd.id='rtd';
      rb.appendChild(rtd);
      var rsk=mk('button','rsk');rsk.textContent='Skip';rsk.setAttribute('data-a','skip');
      rb.appendChild(rsk);card.appendChild(rb);
    }

    if(!isDone){
      var db2=mk('button','dnb');db2.textContent='Mark complete';
      db2.setAttribute('data-a','done');db2.setAttribute('data-i',i);
      card.appendChild(db2);
    }
  }
  return card;
}

function setLoad(i,si,v){if(ss[i])ss[i][si].l=v;}
function setReps(i,si,v){if(ss[i])ss[i][si].r=v;}
function toggleSet(i,si){if(ss[i]){ss[i][si].done=!ss[i][si].done;renderW();}}
function markDone(i){
  ce.add(i);
  var day=cd()[ndi()];
  if(i<day.e.length-1){ci=i+1;startRest(90);}else{wf=true;}
  renderW();
}
function startRest(s){
  if(rt)clearInterval(rt);rs=s;
  rt=setInterval(function(){rs--;var el=document.getElementById('rtd');if(el)el.textContent=fmt(rs);if(rs<=0)stopRest();},1000);
}
function stopRest(){if(rt)clearInterval(rt);rt=null;renderW();}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function saveAndFinish(di){
  var day=cd()[di];
  var dur=Math.round((Date.now()-wt)/60000);
  var sl={};day.e.forEach(function(ex,i){sl[ex.n]=ss[i];});
  var d=gd();
  d.unshift({id:Date.now(),date:new Date().toLocaleDateString('en-CA'),di:di,blk:cb,dn:day.n,dur:dur,comp:ce.size,tot:day.e.length,sl:sl});
  sd(d);ws=false;wf=false;renderW();renderQ();
}

function renderQ(){
  var ni=ndi(),d=gd(),dc=[0,0,0];
  d.forEach(function(x){if(x.di!==undefined)dc[x.di]++;});
  var tm=d.filter(function(x){return x.date&&x.date.startsWith(new Date().toISOString().slice(0,7));}).length;
  var cols=['background:#e8f0fe;color:#1a73e8','background:#e6f4ea;color:#1e8e3e','background:#fef3e2;color:#e37400'];
  var scr=document.getElementById('sq');while(scr.firstChild)scr.removeChild(scr.firstChild);
  scr.appendChild(btog());
  var sg=mk('div','sgr');
  [{l:'Total sessions',v:d.length},{l:'This month',v:tm},{l:'D1 done',v:dc[0]},{l:'D2 done',v:dc[1]}].forEach(function(x){
    var t=mk('div','sti');t.appendChild(mkT('div','stib',x.l));t.appendChild(mkT('div','stiv',''+x.v));sg.appendChild(t);
  });
  scr.appendChild(sg);
  scr.appendChild(mkT('div','sectit','Rotation queue — Block '+cb));
  [0,1,2,3,4].forEach(function(i){
    var idx=(ni+i)%3,day=cd()[idx];
    var qc=mk('div','qc');
    var qn=mk('div','qn');qn.style.cssText=cols[idx];qn.textContent=''+(i+1);
    var qi=mk('div','qi');
    qi.appendChild(mkT('div','qna',(i===0?'▶ ':'')+day.sn));
    qi.appendChild(mkT('div','qsu',day.e.length+' exercises · '+day.b+' · done '+dc[idx]+'x'));
    qc.appendChild(qn);qc.appendChild(qi);scr.appendChild(qc);
  });
}

function renderL(){
  var d=gd(),scr=document.getElementById('sl');while(scr.firstChild)scr.removeChild(scr.firstChild);
  if(!d.length){scr.appendChild(mkT('div','emp','No sessions logged yet. Complete a workout to see history.'));return;}
  d.forEach(function(x){
    var lc=mk('div','lc');
    var db=mk('button','delb');db.textContent='×';db.setAttribute('data-a','del');db.setAttribute('data-i',x.id);
    lc.appendChild(db);
    lc.appendChild(mkT('div','ld',x.date));
    lc.appendChild(mkT('div','lday',(x.dn||'Day '+((x.di||0)+1))+' · Block '+(x.blk||1)));
    var lm=mk('div','lm');
    if(x.dur)lm.appendChild(mkT('span','','⏱ '+x.dur+' min'));
    lm.appendChild(mkT('span','','✓ '+(x.comp||'?')+'/'+(x.tot||'?')));
    lc.appendChild(lm);
    if(x.sl){
      var h=Object.keys(x.sl).filter(function(k){return x.sl[k]&&x.sl[k].some(function(s){return s.l||s.r;});})
        .slice(0,3).map(function(k){return k+': '+x.sl[k].filter(function(s){return s.l||s.r;}).map(function(s){return(s.l?s.l+'lb':'')+(s.l&&s.r?'x':'')+(s.r||'');}).join(', ');}).join(' · ');
      if(h)lc.appendChild(mkT('div','ln',h));
    }
    scr.appendChild(lc);
  });
}

function delEntry(id){sd(gd().filter(function(x){return x.id!==id;}));renderL();renderQ();}

// DOM helpers
function mk(tag,cls){var el=document.createElement(tag);if(cls)el.className=cls;return el;}
function mkT(tag,cls,txt){var el=mk(tag,cls);el.textContent=txt;return el;}
function mkHTML(tag,cls,html){var el=mk(tag,cls);el.innerHTML=html;return el;}

// Init
renderW();
</script>
</body>
</html>
